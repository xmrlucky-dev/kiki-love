
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamu Cinta Aku?</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      width: 320px;
    }

    h1 {
      color: #ff4f81;
      font-size: 28px;
    }

    p {
      color: #777;
      margin-bottom: 30px;
    }

    button {
      border: none;
      padding: 12px 25px;
      margin: 8px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    #yes {
      background: #ff4f81;
      color: white;
    }

    #yes:hover {
      transform: scale(1.1);
    }

    #no {
      background: #eee;
      color: #555;
      position: relative;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #ff4f81;
    }

    .watermark {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>

  <div class="card">
    <div style="font-size: 50px;">💗</div>

    <h1>Kamu cinta aku nggak?</h1>
    <p>Jawab yang jujur yaa... 🥺</p>

    <button id="yes" onclick="yesAnswer()">YES ❤️</button>
    <button id="no" onclick="moveNo()">NO 💔</button>

    <div id="result"></div>
  </div>

  <div class="watermark">Kiki 💗</div>

  <script>
    function yesAnswer() {
      document.getElementById("result").innerHTML =
        "Awww 🥹❤️ Aku juga cinta kamu!";
    }

    function moveNo() {
      const button = document.getElementById("no");

      const maxX = window.innerWidth - button.offsetWidth - 20;
      const maxY = window.innerHeight - button.offsetHeight - 20;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      button.style.position = "fixed";
      button.style.left = x + "px";
      button.style.top = y + "px";
    }
  </script>

</body>
</html>
